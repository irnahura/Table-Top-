# Review the paid service and disk charges before creating this Blueprint.
services:
  - type: web
    name: astralis-backend
    runtime: go
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: go build -tags netgo -ldflags '-s -w' -o astralis-server ./cmd/astralis
    startCommand: ./astralis-server
    healthCheckPath: /health
    envVars:
      - key: GOTOOLCHAIN
        value: auto
      - key: ASTRALIS_DATA_FILE
        value: /var/data/astralis.json
    disk:
      name: astralis-data
      mountPath: /var/data
      sizeGB: 1
