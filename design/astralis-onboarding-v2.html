<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Astralis · World Synchronization</title>
  <style>
    :root{--bg:#0D1114;--surface:#F7F7F5;--fg:#F7F7F5;--muted:#D4D7D4;--border:#D4D7D4;--accent:#FFD21A;--amber:#FF9D4A;--cyan:#18C6D9;--shadow:#0D1114;--font-display:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--font-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--font-mono:ui-monospace,SFMono-Regular,Consolas,monospace}
    *,*::before,*::after{box-sizing:border-box}html,body{min-height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}button{font:inherit;cursor:pointer}a{color:inherit;text-decoration:none}:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
    .loader{min-height:100vh;position:relative;display:grid;grid-template-rows:auto 1fr auto;isolation:isolate;overflow:hidden;background:var(--bg)}.loader::before{content:"";position:absolute;inset:0;z-index:-2;background-image:linear-gradient(180deg,color-mix(in oklch,var(--shadow) 43%,transparent),color-mix(in oklch,var(--shadow) 8%,transparent) 42%,color-mix(in oklch,var(--shadow) 50%,transparent)),url("astralis-detroit-reference-09s.jpg");background-position:center;background-size:cover;filter:saturate(.88) contrast(1.02);transform:scale(1.02)}.loader::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 48%,transparent 0 17%,color-mix(in oklch,var(--shadow) 16%,transparent) 52%,color-mix(in oklch,var(--shadow) 63%,transparent) 100%),linear-gradient(90deg,color-mix(in oklch,var(--shadow) 32%,transparent),transparent 28%,transparent 72%,color-mix(in oklch,var(--shadow) 32%,transparent));pointer-events:none}.topline{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:28px 36px;color:var(--fg)}.wordmark{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:700;letter-spacing:-.04em}.mark{width:26px;height:26px;border:1px solid color-mix(in oklch,var(--fg) 80%,transparent);transform:rotate(45deg);display:grid;place-items:center}.mark::after{content:"";width:7px;height:7px;background:var(--accent);display:block}.session{font:10px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:color-mix(in oklch,var(--fg) 74%,transparent);display:flex;gap:18px}.signal{display:inline-flex;align-items:center;gap:7px}.signal i{width:6px;height:6px;background:var(--cyan);border-radius:50%;box-shadow:0 0 0 4px color-mix(in oklch,var(--cyan) 20%,transparent)}
    .stage{position:relative;z-index:1;display:grid;place-items:center;padding:44px 24px 64px}.stage-inner{width:min(760px,100%);display:flex;flex-direction:column;align-items:center;text-align:center}.eyebrow{font:10px var(--font-mono);letter-spacing:.2em;text-transform:uppercase;color:color-mix(in oklch,var(--fg) 70%,transparent);margin:0 0 34px}.hero-mark{width:80px;height:80px;position:relative;display:grid;place-items:center;margin-bottom:30px}.hero-mark::before{content:"";position:absolute;inset:0;border:1px solid color-mix(in oklch,var(--fg) 72%,transparent);transform:rotate(45deg)}.hero-mark::after{content:"";position:absolute;inset:14px;border:1px solid color-mix(in oklch,var(--accent) 78%,transparent);transform:rotate(45deg)}.core{width:17px;height:17px;background:var(--accent);transform:rotate(45deg);box-shadow:0 0 0 6px color-mix(in oklch,var(--accent) 22%,transparent)}.hero-title{font:600 clamp(42px,7vw,82px)/.95 var(--font-display);letter-spacing:-.075em;margin:0;text-shadow:0 3px 18px color-mix(in oklch,var(--shadow) 45%,transparent)}.hero-title span{display:block;font:10px var(--font-mono);letter-spacing:.2em;text-transform:uppercase;color:color-mix(in oklch,var(--fg) 72%,transparent);margin-top:22px}.location{font-size:14px;color:color-mix(in oklch,var(--fg) 78%,transparent);margin:26px 0 0}.location strong{color:var(--fg);font-weight:600}.status{width:min(540px,100%);margin-top:64px;text-align:left}.status-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}.status-label,.status-count{font:10px var(--font-mono);letter-spacing:.13em;text-transform:uppercase}.status-count{color:color-mix(in oklch,var(--fg) 68%,transparent)}.progress{height:2px;background:color-mix(in oklch,var(--fg) 28%,transparent);overflow:hidden}.progress i{display:block;width:14%;height:100%;background:var(--accent);transition:width .6s ease;box-shadow:0 0 18px color-mix(in oklch,var(--amber) 80%,transparent)}.ticks{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;margin-top:13px}.tick{height:4px;background:color-mix(in oklch,var(--fg) 27%,transparent);transition:background .3s ease}.tick.done{background:color-mix(in oklch,var(--fg) 72%,transparent)}.tick.active{background:var(--accent)}
    .lower{position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:24px 36px 30px}.lower-note{max-width:250px;margin:0;color:color-mix(in oklch,var(--fg) 70%,transparent);font-size:12px}.lower-note strong{display:block;color:var(--fg);font-size:13px;margin-bottom:4px}.actions{display:flex;align-items:center;gap:10px}.btn{min-height:44px;border-radius:10px;padding:0 18px;border:1px solid color-mix(in oklch,var(--fg) 38%,transparent);background:color-mix(in oklch,var(--shadow) 24%,transparent);color:var(--fg);font-size:12px;font-weight:600;transition:background .18s ease,border-color .18s ease,transform .12s ease}.btn:hover{background:color-mix(in oklch,var(--fg) 12%,transparent);border-color:var(--fg)}.btn:active{transform:translateY(1px)}.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--shadow)}.btn-primary:hover{background:color-mix(in oklch,var(--accent) 86%,white);border-color:color-mix(in oklch,var(--accent) 86%,white)}.fineprint{position:absolute;left:50%;bottom:33px;transform:translateX(-50%);font:10px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:color-mix(in oklch,var(--fg) 46%,transparent)}.transition{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .6s ease}.transition.show{opacity:1;pointer-events:auto}.transition p{font:10px var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--shadow);animation:pulse 1.4s ease-in-out infinite alternate}@keyframes pulse{from{opacity:.35}to{opacity:1}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
    @media(max-width:700px){.topline{padding:20px 18px}.session span:last-child{display:none}.stage{padding:34px 18px 90px}.hero-mark{margin-bottom:26px}.status{margin-top:48px}.lower{padding:18px;flex-direction:column;align-items:stretch}.actions{justify-content:flex-end}.fineprint{display:none}}
  </style>
</head>
<body>
  <!-- Background localized from the user-provided video reference at 00:09. -->
  <main class="loader" data-od-id="astralis-loading-v2">
    <header class="topline" data-od-id="loading-header"><a class="wordmark" href="astralis-tabletop.html" data-od-id="loading-brand"><span class="mark" aria-hidden="true"></span><span>Astralis</span></a><div class="session"></div></header>
    <section class="stage" data-od-id="loading-stage"><div class="stage-inner"><div class="hero-mark" aria-hidden="true"><span class="core"></span></div><h1 class="hero-title" data-od-id="loading-title">The Ashen Vale<span>Chapter 02 · Riverside Village</span></h1><p class="location">The old bridge waits beyond the reeds. <strong>World state restored.</strong></p><div class="status" data-od-id="loading-progress"><div class="status-row"><span class="status-label" id="status-label">Initializing world</span><span class="status-count" id="status-count">01 / 07</span></div><div class="progress" aria-label="World synchronization progress"><i id="progress-fill"></i></div><div class="ticks" aria-hidden="true"><i class="tick active"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i></div></div></div></section>
    <footer class="lower" data-od-id="loading-actions"><p class="lower-note"><strong>Enter with intention.</strong>Your choices shape the campaign world and stay with your party.</p><div class="actions"><button class="btn" id="skip" data-od-id="skip-loading">Skip intro</button><button class="btn btn-primary" id="enter" data-od-id="enter-loading">Enter the world <span aria-hidden="true">→</span></button></div></footer>
    <div class="transition" id="transition" aria-hidden="true"><p>Opening Riverside Village</p></div>
  </main>
  <script>
    const labels=['Initializing world','Connecting session','Loading campaign','Syncing characters','Restoring world state','Camera entering the vale','Ready'];
    const fill=document.getElementById('progress-fill'), label=document.getElementById('status-label'), count=document.getElementById('status-count'), ticks=[...document.querySelectorAll('.tick')]; let step=0;
    function advance(){step=Math.min(step+1,labels.length-1);label.textContent=labels[step];count.textContent=String(step+1).padStart(2,'0')+' / 07';fill.style.width=((step+1)/7*100)+'%';ticks.forEach((tick,index)=>{tick.classList.toggle('done',index<step);tick.classList.toggle('active',index===step)})}
    const timer=setInterval(()=>{advance();if(step===6)clearInterval(timer)},850);
    function enterWorld(){document.getElementById('transition').classList.add('show');document.getElementById('transition').setAttribute('aria-hidden','false');setTimeout(()=>{window.location.href='astralis-campaign-select.html'},650)}
    document.getElementById('enter').addEventListener('click',enterWorld);document.getElementById('skip').addEventListener('click',enterWorld);
  </script>


</body></html>
